<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лабораторная работа №1</title>
<style>
:root{--bg:#eef4fb;--card:#fff;--tx:#1a2233;--mut:#5b6b82;--pri:#1565c0;--ok:#0b7a3b;--okb:#d9f5e3;--bad:#c62828;--badb:#fde2e2;--bd:#cfdcec}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11171f;--card:#1b2430;--tx:#e8eef7;--mut:#9fb0c6;--pri:#64b5f6;--ok:#7be0a1;--okb:#143323;--bad:#ff8a80;--badb:#3d1b1b;--bd:#2f3d50}}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.w{max-width:640px;margin:0 auto;padding:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h1{font-size:20px;margin:0 0 6px;color:var(--pri)}h2{font-size:17px;margin:0 0 6px}
.m{color:var(--mut);font-size:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--pri);color:#fff;border:0;font-weight:700;margin-top:12px}button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}.row b{min-width:78px}.row span{min-width:46px;font-size:13px;color:var(--mut)}
.f{background:#fff8e1;color:#5d4037;border-left:4px solid #ffb300;padding:8px 10px;border-radius:8px;margin:8px 0;font-size:15px}
table{border-collapse:collapse;width:100%;text-align:center}td,th{border:1px solid var(--bd);padding:5px}th{background:#e3f0ff;color:#0d3c78}
.r{padding:7px 10px;border-radius:8px;margin:5px 0;font-size:15px}.r.ok{background:var(--okb);color:var(--ok);font-weight:700}.r.bad{background:var(--badb);color:var(--bad);font-weight:700}
.big{font-size:26px;font-weight:800;text-align:center}svg{width:100%;height:auto;background:#fff;border-radius:10px;border:1px solid var(--bd)}
.hide{display:none}
</style></head><body><div class="w">

<div class="c" id="start">
<h1>Лабораторная работа №1</h1>
<div class="m">«Определение ускорения тела, движущегося по наклонному желобу»<br>Физика, 1 курс колледжа · Преподаватель: Кунгозин Даулет Багдашұлы</div>
<label>Фамилия и имя</label><input id="fio" placeholder="Введите ФИ" autocomplete="name">
<label>Группа</label><select id="grp"><option value="">— выберите —</option><option>Т-116</option><option>ПМЛ-116</option></select>
<label>Вариант</label><select id="var"><option value="">— выберите —</option><option value="1">Вариант 1</option><option value="2">Вариант 2</option><option value="3">Вариант 3</option><option value="4">Вариант 4</option></select>
<div class="f">Всего 100 баллов. Результат придёт преподавателю автоматически после нажатия «Завершить».</div>
<button id="go">Начать работу</button>
</div>

<div id="lab" class="hide"></div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyXFnk8koPGPmrooxXe0TMmGjPToMCPOPWSlq3vXT9SjbEvm5WPnh4i7W5hKL-8ZqYk/exec";
const G=9.8,F=[.2,.4,.6,.8];
const VAR={1:{L:1.0,h:.10,n:[.01,-.015,.012,-.008]},2:{L:1.2,h:.15,n:[-.012,.01,-.01,.015]},3:{L:1.0,h:.12,n:[.015,-.01,.008,-.012]},4:{L:1.2,h:.18,n:[-.01,.012,.015,-.01]}};
const $=id=>document.getElementById(id), r2=x=>Math.round(x*100)/100;
let D,I=[],ST={};

function calc(k){const v=VAR[k],L=v.L,h=v.h,s=F.map(f=>r2(f*L)),ae=.93*G*h/L;
 const t=s.map((x,i)=>r2(Math.sqrt(2*x/ae)*(1+v.n[i])));
 const t2=t.map(x=>x*x),a=s.map((x,i)=>2*x/t2[i]),am=a.reduce((p,c)=>p+c)/4,sn=h/L,at=G*sn;
 const kk=s.reduce((p,x,i)=>p+x*t2[i],0)/t2.reduce((p,x)=>p+x*x,0);
 return{L,h,s,t,t2,a,am,sn,at,eps:Math.abs(at-am)/at*100,k:kk,xm:Math.ceil(Math.max(...t2)*2)/2};
}
function items(d){const L=['t₁²','t₂²','t₃²','t₄²','a₁','a₂','a₃','a₄','a ср','sin α','a теор','ε','a по графику','Вывод'];
 const U=['с²','с²','с²','с²','м/с²','м/с²','м/с²','м/с²','м/с²','','м/с²','%','м/с²',''];
 const P=[3,3,3,3,5,5,5,5,10,8,10,12,13,15];
 const A=[...d.t2,...d.a,d.am,d.sn,d.at,d.eps,2*d.k,'Б'];
 const R=[.03,.03,.03,.03,.04,.04,.04,.04,.04,.03,.04,.1,.08,0],B=[.02,.02,.02,.02,.03,.03,.03,.03,.03,.003,.03,.6,.1,0];
 return L.map((l,i)=>({n:l,u:U[i],p:P[i],a:A[i],r:R[i],b:B[i]}));
}
function scheme(d){const sc=250/d.L,bx=Math.sqrt(d.L*d.L-d.h*d.h)*sc,hy=d.h*sc,x0=30,y0=190;
 const ax=x0,ay=y0-hy,cx=x0+bx,cy=y0,px=ax+(cx-ax)*.14,py=ay+(cy-ay)*.14-10;
 return `<svg viewBox="0 0 320 230"><rect width="320" height="230" fill="#e8f6ff"/><rect y="190" width="320" height="40" fill="#7cc47a"/>
 <polygon points="${ax},${ay} ${x0},${y0} ${cx},${cy}" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
 <line x1="${ax}" y1="${ay}" x2="${cx}" y2="${cy}" stroke="#bf360c" stroke-width="5"/>
 <circle cx="${px}" cy="${py}" r="10" fill="#e53935" stroke="#7f0000" stroke-width="2"/>
 <rect x="${cx-26}" y="${cy-14}" width="26" height="14" fill="#1e88e5" rx="3"/>
 <text x="${(ax+cx)/2+8}" y="${(ay+cy)/2-8}" fill="#bf360c" font-size="14" font-weight="700">L = ${d.L} м</text>
 <text x="${x0-26}" y="${(ay+y0)/2+4}" fill="#1b5e20" font-size="14" font-weight="700">h</text>
 <text x="${x0+4}" y="${(ay+y0)/2+4}" fill="#1b5e20" font-size="12">${d.h} м</text>
 <text x="${cx-60}" y="${cy-4}" fill="#6a1b9a" font-size="15" font-weight="700">α</text>
 <text x="14" y="18" font-size="13" fill="#0d3c78">Шарик скатывается из состояния покоя</text>
 <text x="14" y="36" font-size="13" fill="#0d3c78">Синий блок — остановка, секундомер</text></svg>`;
}
function graph(d){const W=340,H=300,l=46,b=34,t=18,rr=12,pw=W-l-rr,ph=H-t-b,xm=d.xm,ym=d.L;
 const X=x=>l+x/xm*pw,Y=y=>t+ph-y/ym*ph;let g='';
 for(let i=0;i<=Math.round(xm/.25);i++){const x=i*.25,M=i%2==0;g+=`<line x1="${X(x)}" y1="${t}" x2="${X(x)}" y2="${t+ph}" stroke="${M?'#7fb3e6':'#cfe3f5'}" stroke-width="${M?1:.6}"/>`;if(M)g+=`<text x="${X(x)}" y="${t+ph+14}" font-size="10" text-anchor="middle" fill="#0d3c78">${x}</text>`}
 for(let j=0;j<=10;j++){const y=ym*j/10;g+=`<line x1="${l}" y1="${Y(y)}" x2="${l+pw}" y2="${Y(y)}" stroke="${j%5?'#cfe3f5':'#7fb3e6'}" stroke-width="${j%5?.6:1}"/><text x="${l-4}" y="${Y(y)+3}" font-size="10" text-anchor="end" fill="#0d3c78">${r2(y)}</text>`}
 const xa=r2(xm*.8),ya=d.k*xa;
 g+=`<line x1="${l}" y1="${t+ph}" x2="${l+pw}" y2="${t+ph}" stroke="#000" stroke-width="2"/><line x1="${l}" y1="${t}" x2="${l}" y2="${t+ph}" stroke="#000" stroke-width="2"/>
 <line x1="${X(0)}" y1="${Y(0)}" x2="${X(xm)}" y2="${Y(d.k*xm)}" stroke="#2e7d32" stroke-width="2.5"/>
 <line x1="${X(xa)}" y1="${Y(ya)}" x2="${X(xa)}" y2="${Y(0)}" stroke="#6a1b9a" stroke-dasharray="4 3"/>
 <circle cx="${X(xa)}" cy="${Y(ya)}" r="5" fill="#6a1b9a"/><text x="${X(xa)+6}" y="${Y(ya)-6}" font-size="12" font-weight="700" fill="#6a1b9a">A</text>`;
 d.t2.forEach((x,i)=>g+=`<circle cx="${X(x)}" cy="${Y(d.s[i])}" r="4.5" fill="#e53935" stroke="#7f0000"/>`);
 g+=`<text x="${l+pw/2}" y="${H-4}" font-size="12" text-anchor="middle" font-weight="700" fill="#0d3c78">t², с²</text><text x="4" y="12" font-size="12" font-weight="700" fill="#0d3c78">s, м</text>`;
 return{svg:`<svg viewBox="0 0 ${W} ${H}">${g}</svg>`,xa};
}
function row(i){const it=I[i];return `<div class="row"><b>${it.n}</b><input id="f${i}" inputmode="decimal" placeholder="0,00"><span>${it.u}</span></div>`}
function step(n,t,txt,formula,ids){return `<div class="c"><h2>Шаг ${n}. ${t}</h2><div>${txt}</div>${formula?`<div class="f">${formula}</div>`:''}${ids.map(row).join('')}</div>`}

$('go').onclick=()=>{const fio=$('fio').value.trim(),g=$('grp').value,v=$('var').value;
 if(fio.length<3||!g||!v){alert('Введите ФИ, выберите группу и вариант');return}
 ST={fio,g,v};D=calc(v);I=items(D);const gr=graph(D);
 const tb=`<table><tr><th>№</th><th>s, м</th><th>t, с</th></tr>${D.s.map((x,i)=>`<tr><td>${i+1}</td><td>${x}</td><td>${D.t[i]}</td></tr>`).join('')}</table>`;
 $('start').classList.add('hide');const lab=$('lab');lab.classList.remove('hide');
 lab.innerHTML=`<div class="c"><h1>Лабораторная работа №1</h1><div class="m">${fio} · ${g} · Вариант ${v}</div>
 <p><b>Цель:</b> определить ускорение тела, скатывающегося по наклонному желобу из состояния покоя, и сравнить с теоретическим значением.</p>
 <p><b>Оборудование:</b> желоб, шарик, секундомер, линейка. Принять g = 9,8 м/с². Ответы округляйте до 2 знаков после запятой, дробь пишите через запятую или точку.</p>${scheme(D)}</div>
 <div class="c"><h2>Шаг 0. Данные опыта</h2>Шарик пускали без начальной скорости. Для четырёх расстояний s секундомером измерено время t:${tb}
 <div class="m">Длина желоба L = ${D.L} м, высота подъёма h = ${D.h} м.</div></div>`
 +step(1,'Квадрат времени','Для каждого опыта возведите время в квадрат (нужно для графика).','t² = t · t',[0,1,2,3])
 +step(2,'Ускорение в каждом опыте','Движение равноускоренное без начальной скорости: s = at²/2, значит',"a = 2s / t²",[4,5,6,7])
 +step(3,'Среднее ускорение','Сложите четыре значения a и разделите на 4.','a ср = (a₁+a₂+a₃+a₄) / 4',[8])
 +step(4,'Теоретическое ускорение','Сначала найдите синус угла наклона, затем ускорение без трения.','sin α = h / L; &nbsp; a теор = g · sin α',[9,10])
 +step(5,'Относительная погрешность','Насколько опыт отличается от теории (в процентах).','ε = |a теор − a ср| / a теор · 100 %',[11])
 +`<div class="c"><h2>Шаг 6. График s(t²)</h2>Красные точки — ваши опыты, зелёная прямая — линия графика. По клеткам найдите на оси s значение для точки A при <b>t² = ${gr.xa} с²</b> (фиолетовая точка).${gr.svg}<div class="f">a = 2·s<sub>A</sub> / t<sub>A</sub>²</div>${row(12)}</div>`
 +`<div class="c"><h2>Шаг 7. Вывод</h2>График s(t²) — прямая через начало координат. Что это означает?<select id="f13"><option value="">— выберите —</option><option value="А">А) путь пропорционален времени, скорость растёт</option><option value="Б">Б) путь пропорционален t², движение равноускоренное</option><option value="В">В) путь не зависит от времени</option></select></div>
 <div class="c"><h2>Критерии оценивания (100 баллов)</h2><table><tr><th>Шаг</th><th>Баллы</th></tr><tr><td>1. t² (4×3)</td><td>12</td></tr><tr><td>2. a₁–a₄ (4×5)</td><td>20</td></tr><tr><td>3. a ср</td><td>10</td></tr><tr><td>4. sin α (8) + a теор (10)</td><td>18</td></tr><tr><td>5. ε</td><td>12</td></tr><tr><td>6. a по графику</td><td>13</td></tr><tr><td>7. Вывод</td><td>15</td></tr></table></div>
 <button id="fin">Завершить и отправить</button><div id="res"></div>`;
 $('fin').onclick=finish;window.scrollTo(0,0)};

function finish(){let sc=0,out=[],h='';
 for(let i=0;i<I.length;i++){const it=I[i],raw=($('f'+i).value||'').trim();let ok=false;
  if(i==13)ok=raw===it.a;else{const v=parseFloat(raw.replace(',','.'));ok=!isNaN(v)&&Math.abs(v-it.a)<=Math.max(it.r*Math.abs(it.a),it.b)}
  if(ok)sc+=it.p;const key=i==13?'Б':(+it.a).toFixed(2);
  out.push({n:it.n,ans:raw||'—',key:key,ok:ok,pts:ok?it.p:0});
  h+=`<div class="r ${ok?'ok':'bad'}">${ok?'✔':'✘'} ${it.n}: ${raw||'—'} ${ok?'':'(верно: '+key+' '+it.u+')'} — ${ok?it.p:0}/${it.p}</div>`}
 $('fin').disabled=true;
 $('res').innerHTML=`<div class="c"><h2>Результат</h2><div class="m">${ST.fio} · ${ST.g} · Вариант ${ST.v}</div><div class="big" style="color:var(${sc>=50?'--ok':'--bad'})">${sc} / 100</div><div class="m" style="text-align:center">Ваш балл. Разбор по пунктам доступен только преподавателю.</div><div class="m" id="st">Отправка преподавателю…</div></div>`;
 const body=JSON.stringify({fio:ST.fio,group:ST.g,variant:ST.v,score:sc,items:out});
 fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}).then(()=>{$('st').textContent='Результат отправлен преподавателю.'}).catch(()=>{$('st').textContent='Не удалось отправить. Сделайте скриншот и покажите преподавателю.'});
 $('res').scrollIntoView({behavior:'smooth'});
}
</script></body></html>
